name: Build distribution

on:
  push:
    branches:
      - "**"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install zip
        run: sudo apt-get update && sudo apt-get install -y zip

      - name: Create version tag
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          timestamp="$(TZ=Europe/Madrid date +%s)"

          for attempt in {1..120}; do
            version="$(TZ=Europe/Madrid date -d "@$timestamp" +'%y.%m.%d_%H%M')"

            if gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f "ref=refs/tags/$version" \
              -f "sha=$GITHUB_SHA" >/dev/null 2>&1; then
              echo "value=$version" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            timestamp=$((timestamp + 60))
          done

          echo "No se pudo crear una etiqueta de versión disponible." >&2
          exit 1

      - name: Build manifest and archive
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          bash scripts/new-manifest.sh --template-version "$VERSION"

      - name: Upload distribution artifact
        uses: actions/upload-artifact@v4
        with:
          name: aiconventions-dist
          path: |
            dist/manifest.json
            dist/aiconventions.zip
          if-no-files-found: error

      - name: Publish release assets
        env:
          VERSION: ${{ steps.version.outputs.value }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$VERSION" \
            --title "$VERSION" \
            --notes "Distribucion $VERSION" \
            --target "$GITHUB_SHA"

          gh release upload "$VERSION" \
            dist/manifest.json \
            dist/aiconventions.zip \
            --clobber
