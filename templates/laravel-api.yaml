standard: 26.9.21
context:
  template: laravel-api
  declared:
    language: PHP 8.3 o superior
    framework: Laravel 12 o superior
    server: Apache 2.4
    ci: GitLab CI
  database:
    production: Oracle 19c
    development: SQLite
    tests: SQLite en memoria
  dependencies:
  - package: yajra/laravel-oci8
    purpose: Conexión con Oracle 19c en preproducción y producción; Laravel no soporta Oracle de serie
  auth: SSO corporativo (JWT)
  deployment:
    packaging: Código PHP desplegado sobre Apache 2.4
    documentRoot: public/
    assets: SPA compilada con Vite antes del despliegue
  ui:
    views: React 18 o superior
    entry: resources/js/
    rootTemplate: Blade, solo la plantilla raíz que monta la SPA
    bridge: API REST + SPA
    dependencies:
    - package: react, react-dom
      purpose: Capa de vistas de la aplicación
    - package: react-router-dom
      purpose: Enrutado en el cliente de la SPA
    - package: "@vitejs/plugin-react"
      purpose: Compilación de JSX con el Vite que ya usa Laravel
  mcp:
  - name: dsjex
    purpose: Sistema de Diseño de la Junta de Extremadura (componentes shadcn sobre Base UI, tokens y app shell) para la SPA React de resources/js/
    server:
      type: http
      url: https://dsjex.socialytech.es/mcp/
    init:
      tool: iniciar_proyecto
      adaptation:
      - El proyecto lo crea Laravel; no se ejecuta `npm create vite`. Las dependencias del paso 2 del plan se instalan en el `package.json` de la raíz.
      - Donde el plan dice `src/`, se usa `resources/js/`, con el alias `@` apuntando ahí en `vite.config.*` y en `tsconfig.json`.
      - Los tokens de `tokens_jex` van en `resources/css/app.css`.
      - El `app_shell` se usa tal cual, con `react-router-dom`; Laravel sirve la plantilla Blade raíz en una ruta comodín de `routes/web.php` y deja `/api/*` para la API.
      - Los componentes se inicializan con Base UI y se piden con `codigo_componente`; Base UI usa la prop `render`, no `asChild`.
  conventions:
    paths:
      code: app/
      routes: routes/
      apiRoutes: routes/api.php
      migrations: database/migrations/
      tests: tests/
      viewTests: resources/js/tests/
      e2e: tests/e2e/
      config: config/
      views: resources/js/
      layouts: resources/views/
      assets: resources/
      static: public/
      ci: .gitlab-ci.yml
    generated:
    - vendor/
    - node_modules/
    - bootstrap/cache/
    - storage/framework/
    - public/build/
    buildTools:
    - file: composer.json
      commands:
        install: composer install
        setup: composer setup
        run: composer dev
        migrate: php artisan migrate
        test: php artisan test
        testFilter: php artisan test --filter=NombreDeLaPrueba
        formatCheck: vendor/bin/pint --test
        format: vendor/bin/pint
        staticAnalysis: vendor/bin/phpstan analyse
    - file: package.json
      commands:
        install: npm ci
        run: npm run dev
        build: npm run build
        test: npm test
        staticAnalysis: npm run lint
