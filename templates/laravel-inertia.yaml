standard: 26.9.21
context:
  template: laravel-inertia
  declared:
    language: PHP 8.3 o superior
    framework: Laravel 12 o superior
    server: Apache 2.4
    ci: GitLab CI
  database:
    production: Oracle 19c
    development: SQLite
    tests: SQLite en memoria
  dependencies:
  - package: yajra/laravel-oci8
    purpose: Conexión con Oracle 19c en preproducción y producción; Laravel no soporta Oracle de serie
  - package: inertiajs/inertia-laravel
    purpose: Adaptador de Inertia en el backend; lo instala el kit de Laravel con React
  auth: SSO corporativo (JWT)
  deployment:
    packaging: Código PHP desplegado sobre Apache 2.4
    documentRoot: public/
    assets: Compilados con Vite antes del despliegue
  ui:
    views: React 18 o superior
    entry: resources/js/
    rootTemplate: Blade, solo la plantilla raíz que monta la aplicación React
    bridge: Inertia.js
    dependencies:
    - package: react, react-dom
      purpose: Capa de vistas de la aplicación
    - package: "@inertiajs/react"
      purpose: Páginas React servidas desde las rutas de Laravel, sin API intermedia
    - package: "@vitejs/plugin-react"
      purpose: Compilación de JSX con el Vite que ya usa Laravel
  mcp:
  - name: dsjex
    purpose: Sistema de Diseño de la Junta de Extremadura (componentes shadcn sobre Base UI, tokens y app shell) para las vistas React de resources/js/
    server:
      type: http
      url: https://dsjex.socialytech.es/mcp/
    init:
      tool: iniciar_proyecto
      adaptation:
      - El proyecto ya lo crea el kit de Laravel; no se ejecuta `npm create vite`.
      - Donde el plan dice `src/`, se usa `resources/js/`; el alias `@` del kit ya apunta ahí.
      - Los tokens de `tokens_jex` van en `resources/css/app.css`.
      - Con Inertia no se instala `react-router-dom`; las rutas del `app_shell` se declaran en `routes/web.php` y se navega con `Link` de Inertia.
      - El layout del `app_shell` va en `resources/js/layouts/` y las páginas en `resources/js/pages/`.
      - Los componentes de `resources/js/components/ui/` que trae el kit (Radix) se sustituyen por los del catálogo (Base UI), pedidos con `codigo_componente`; Base UI usa la prop `render`, no `asChild`.
  conventions:
    paths:
      code: app/
      routes: routes/
      migrations: database/migrations/
      tests: tests/
      viewTests: resources/js/tests/
      e2e: tests/e2e/
      config: config/
      views: resources/js/
      layouts: resources/views/
      assets: resources/
      static: public/
      ci: .gitlab-ci.yml
    generated:
    - vendor/
    - node_modules/
    - bootstrap/cache/
    - storage/framework/
    - public/build/
    formatIgnore:
      file: vite.config.ts
      key: fmt.ignorePatterns
      patterns:
      - .agents/**
      - .ai/**
      - .claude/**
      - docs/**
      - openspec/**
      - AGENTS.md
      - CLAUDE.md
    buildTools:
    - file: composer.json
      commands:
        install: composer install
        setup: composer setup
        run: composer dev
        migrate: php artisan migrate
        test: php artisan test
        testFilter: php artisan test --filter=NombreDeLaPrueba
        format: composer lint
        formatCheck: composer lint:check
        staticAnalysis: composer types:check
        ci: composer ci:check
    - file: package.json
      commands:
        install: npm ci
        build: npm run build
        formatCheck: npm run check
        format: npm run check:fix
        staticAnalysis: npm run types:check
    ci:
      file: .gitlab-ci.yml
      replaces: .github/workflows/
      content: |
        # Generado por setup-project-context a partir de docs/stack.yaml.
        # Hace lo mismo que el workflow de GitHub Actions del kit de Laravel:
        # prepara la aplicación y ejecuta las comprobaciones de composer ci:check.
        stages:
          - check

        variables:
          COMPOSER_CACHE_DIR: "$CI_PROJECT_DIR/.cache/composer"
          npm_config_cache: "$CI_PROJECT_DIR/.cache/npm"

        ci:
          stage: check
          # [POR DEFINIR] Imagen del registro corporativo con PHP 8.3 o superior,
          # Composer 2, Node 22 y las extensiones de Laravel (pdo_sqlite incluida).
          image: "$CI_PHP_NODE_IMAGE"
          cache:
            key:
              files:
                - composer.lock
                - package-lock.json
            paths:
              - .cache/
          script:
            - composer setup
            - composer ci:check
          rules:
            - if: $CI_PIPELINE_SOURCE == "merge_request_event"
            - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
